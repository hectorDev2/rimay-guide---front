schema: spec-driven

context: |
  Tech stack: React 18.3, TypeScript 6, Vite 6.3, Tailwind CSS 4, MUI 7, Zustand 5, Supabase, Three.js, i18next, Gemini AI
  Architecture: SPA con Atomic Design, stores con Zustand, PWA con service worker, Supabase Auth + DB
  Testing: No test runner detected
  Style: TypeScript strict mode, @/ path alias, ES2022 target

strict_tdd: false

testing:
  strict_tdd: false
  detected: 2026-06-01
  runner:
    command: none
    framework: none
  layers:
    unit: { available: false, tool: '—' }
    integration: { available: false, tool: '—' }
    e2e: { available: false, tool: '—' }
  coverage:
    available: false
    command: '—'
  quality:
    linter: { available: false, command: '—' }
    type_checker: { available: true, command: 'tsc --noEmit' }
    formatter: { available: false, command: '—' }

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
  verify:
    - Run tsc --noEmit for type checking if available
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)
